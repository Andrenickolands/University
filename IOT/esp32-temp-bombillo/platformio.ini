; Proyecto: Circuito ESP32 con sensor de temperatura y bombillo con resistencia
; Entorno: PlatformIO + Wokwi Simulator (Visual Studio Code)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/DHT sensor library@^1.4.4
    adafruit/Adafruit Unified Sensor@^1.1.9
